name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build single-file exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name EveMumbleOverlay `
            --icon "${{ github.workspace }}\overlay.ico" `
            --distpath dist --workpath build --specpath build EveMumbleOverlay.pyw

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "dist\EveMumbleOverlay.exe"
          if (-not (Test-Path $exe)) { throw "exe not built" }

          # GUI 子系统程序必须用 Start-Process -Wait，否则 `&` 不等待、$LASTEXITCODE 是 $null
          $logDir = Join-Path $env:LOCALAPPDATA 'EveMumbleOverlay'
          if (Test-Path $logDir) { Remove-Item $logDir -Recurse -Force }

          $p = Start-Process -FilePath $exe -ArgumentList '--autostart', 'off' -Wait -PassThru
          Write-Host "exit code = $($p.ExitCode)"
          if ($null -ne $p.ExitCode -and $p.ExitCode -ne 0) {
            throw "smoke test failed with exit code $($p.ExitCode)"
          }

          $log = Join-Path $logDir 'overlay.log'
          if (-not (Test-Path $log)) { throw "程序没有写出日志文件：$log" }
          $hit = Select-String -Path $log -Pattern '开机自启' -SimpleMatch
          if (-not $hit) { throw "日志里没有预期的启动记录：" + (Get-Content $log -Raw) }
          Write-Host "log ok: $($hit.Line)"

          $size = (Get-Item $exe).Length
          Write-Host "built exe: $size bytes"
          if ($size -lt 3MB) { throw "exe looks too small: $size bytes" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EveMumbleOverlay
          path: dist/EveMumbleOverlay.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EveMumbleOverlay.exe
          generate_release_notes: true
          overwrite_files: true
